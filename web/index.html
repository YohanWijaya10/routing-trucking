<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Planner Console</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <main class="workspace">
        <section class="topbar">
          <div class="brandblock">
            <p class="eyebrow">Dispatch Lab</p>
            <h1>Route Planner</h1>
          </div>
          <div class="topbar-meta">
            <div class="top-metric">
              <span>Solver</span>
              <strong id="solverBadge">Auto</strong>
            </div>
            <div class="top-metric">
              <span>Matrix</span>
              <strong id="matrixBadge">Estimated</strong>
            </div>
            <button id="loadSampleBtn" class="ghost small">Load Sample</button>
            <button id="loadDummyBtn" class="ghost small">Dummy 100</button>
            <button id="planBtn" class="small">Generate</button>
          </div>
        </section>

        <section class="grid-two">
          <section class="panel">
            <div class="panel-header">
              <div>
                <p class="section-kicker">Input</p>
                <h3>Planner Config</h3>
              </div>
            </div>

            <form id="plannerForm" class="planner-form">
              <div class="field-row">
                <label>
                  <span>Depot Name</span>
                  <input id="depotName" type="text" value="Gudang Surabaya" />
                </label>
                <label>
                  <span>Solver</span>
                  <select id="solver">
                    <option value="auto">Auto</option>
                    <option value="ortools">OR-Tools</option>
                    <option value="greedy">Greedy</option>
                  </select>
                </label>
              </div>

              <div class="field-row three">
                <label>
                  <span>Depot Lat</span>
                  <input id="depotLat" type="number" step="any" value="-7.2575" />
                </label>
                <label>
                  <span>Depot Lng</span>
                  <input id="depotLng" type="number" step="any" value="112.7521" />
                </label>
                <label class="toggle-wrap">
                  <span>Use ORS Matrix</span>
                  <input id="useOrs" type="checkbox" checked />
                </label>
              </div>

              <label>
                <span>ORS API Key</span>
                <input id="orsApiKey" type="text" placeholder="Opsional" />
              </label>

              <div class="field-row db-row">
                <label>
                  <span>Database URL</span>
                  <input id="databaseUrl" type="text" placeholder="postgresql://..." />
                </label>
                <label>
                  <span>City</span>
                  <input id="cityName" type="text" value="surabaya" />
                </label>
                <label>
                  <span>Dummy Count</span>
                  <input id="dummyCount" type="number" min="1" max="500" value="100" />
                </label>
              </div>

              <div class="subsection">
                <div class="subsection-head">
                  <h4>Vehicles</h4>
                  <button type="button" id="addVehicleBtn" class="ghost small">Tambah</button>
                </div>
                <div id="vehiclesTable" class="table-list"></div>
              </div>

              <div class="subsection">
                <div class="subsection-head">
                  <h4>Orders</h4>
                  <button type="button" id="addOrderBtn" class="ghost small">Tambah</button>
                </div>
                <div id="ordersTable" class="table-list"></div>
              </div>

              <div class="subsection">
                <div class="subsection-head">
                  <h4>Group Mapping</h4>
                  <button type="button" id="resetGroupsBtn" class="ghost small">Reset</button>
                </div>
                <div id="districtGroupsTable" class="table-list"></div>
              </div>
            </form>
          </section>

          <section class="panel results">
            <div class="panel-header">
              <div>
                <p class="section-kicker">Output</p>
                <h3>Dispatch Result</h3>
              </div>
              <div id="statusPill" class="status-pill idle">Idle</div>
            </div>

            <div id="summaryGrid" class="summary-grid">
              <div class="summary-item">
                <span>Vehicles</span>
                <strong id="vehiclesUsed">-</strong>
              </div>
              <div class="summary-item">
                <span>Distance</span>
                <strong id="totalDistance">-</strong>
              </div>
              <div class="summary-item">
                <span>Duration</span>
                <strong id="totalDuration">-</strong>
              </div>
              <div class="summary-item">
                <span>Orders</span>
                <strong id="ordersPlanned">-</strong>
              </div>
            </div>

            <div id="errorBox" class="error-box hidden"></div>

            <div class="result-block">
              <h4>Groups</h4>
              <div id="groupsList" class="groups-list">
                <p class="muted">Belum ada grup.</p>
              </div>
            </div>

            <div class="result-block">
              <h4>Summary</h4>
              <pre id="textSummary" class="code-box">Belum ada hasil.</pre>
            </div>

            <div class="result-block">
              <h4>Routes</h4>
              <div id="routesList" class="routes-list">
                <p class="muted">Belum ada rute.</p>
              </div>
            </div>

            <div class="result-block">
              <h4>Map</h4>
              <div id="map" class="map-box"></div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <template id="vehicleRowTemplate">
      <div class="table-row vehicle-row">
        <input class="vehicle-id" type="text" placeholder="TRUCK-1" />
        <input class="vehicle-capacity" type="number" min="1" placeholder="Kg" />
        <input class="vehicle-maxstops" type="number" min="1" placeholder="Stops" />
        <button type="button" class="ghost small remove-row">Hapus</button>
      </div>
    </template>

    <template id="orderRowTemplate">
      <div class="table-row order-row">
        <input class="order-id" type="text" placeholder="ID" />
        <input class="order-name" type="text" placeholder="Customer" />
        <input class="order-lat" type="number" step="any" placeholder="Lat" />
        <input class="order-lng" type="number" step="any" placeholder="Lng" />
        <input class="order-demand" type="number" min="1" placeholder="Kg" />
        <input class="order-service" type="number" min="1" placeholder="Min" />
        <button type="button" class="ghost small remove-row">Hapus</button>
      </div>
    </template>

    <template id="districtGroupRowTemplate">
      <div class="table-row district-group-row">
        <input class="district-name" type="text" readonly />
        <input class="group-label" type="text" placeholder="Group A - Surabaya Barat" />
      </div>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
